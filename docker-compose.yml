# Optional: run PostgreSQL locally for a production-like setup.
# The app also works with zero setup using SQLite (see backend/.env.example).
#
# Usage:
#   docker compose up -d
#   # then point the backend at it:
#   #   DATABASE_URL=postgresql+psycopg://aipentest:devpassword@localhost:5432/aipentest
#
# NOTE: the password below is a local DEVELOPMENT value only. Never use it in
# production, and never commit real credentials (see docs/platform-hardening-spec.md).

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aipentest
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: aipentest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
